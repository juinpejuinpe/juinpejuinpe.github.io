about:
  eyebrow: 觀月者
  heading: 一個把城市掛上夜空的人
  paragraphs:
    - 香淚月，00後，香港人。筆名有一個不可告人的來源，正在大學讀一個要和人類與非人類打交道的科系。
    - 她把哭過的城市記憶一顆顆摺成童幻月亮，安放在陌生行星的夜空。風格遊走在流行文學與傳統文學之間，作品曾刊於《聲韻詩刊》、《大頭菜文藝月刊》與《盒誌》。
    - 相信文字是慢性的解藥，喜歡咖啡、酒，也喜歡貓。夜裏低頭寫字，抬頭替城市觀月。

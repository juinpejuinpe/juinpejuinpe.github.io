about:
  eyebrow: 調香師
  heading: 一個漏進人間的奇蹟
  paragraphs:
    - 香淚月，00後，香港人。筆名有一個不可告人的來源，正在大學讀一個要和人類與非人類打交道的科系。
    - 風格偏向多姿多彩，走自己的單程路，遊走在流行文學與傳統文學之間。作品曾刊於《聲韻詩刊》、《大頭菜文藝月刊》與《盒誌》。
    - 相信把眼淚釀成文字，文字就會變成香。喜歡咖啡，也喜歡酒。
